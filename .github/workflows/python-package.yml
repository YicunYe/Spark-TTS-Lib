# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Package

on:
  push:
    branches: [ "lib" ]
  pull_request:
    branches: [ "lib" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install PDM  # 安装 PDM
      run: |
        python -m pip install --upgrade pip
        python -m pip install pdm
    - name: Install dependencies  # 安装依赖
      run: |
        pdm install
        pdm add pytest>=8.3.5 pytest-order>=1.0.1 flake8>=7.0.0
    - name: Run linting  # 运行 lint
      run: |
        pdm run lint
    - name: Run tests  # 运行测试（只测试 CPU 推理）
      env:
        HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      run: |
        pdm test
    - name: Build package  # 构建包
      run: |
        pdm build
    - name: Upload artifact  # 上传包
      uses: actions/upload-artifact@v4
      with:
        path: ./dist/*
        name: dist-py${{ matrix.python-version }}
    - uses: actions/cache@v3  # 缓存模型文件
      with:
        path: ./pretrained_models
        key: model-cache
