repos:
# 基础检查工具
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    -   id: trailing-whitespace    # 检查行尾空格
    -   id: end-of-file-fixer     # 确保文件以换行符结束
    -   id: check-yaml            # 检查 YAML 语法
    -   id: check-added-large-files  # 检查大文件
    -   id: check-ast             # 检查 Python 语法
    -   id: check-json            # 检查 JSON 语法

# 代码格式化工具
-   repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
    -   id: black                 # 格式化 Python 代码

# 导入排序
-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort                 # 排序 Python 导入

# 代码检查
-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8                # 检查代码风格
        additional_dependencies: [
            'flake8-docstrings',
            'flake8-bugbear',
            'flake8-comprehensions',
        ]

# 类型检查
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
    -   id: mypy                  # 类型检查
        additional_dependencies: [
            'types-requests',
            'types-setuptools',
            'types-urllib3',
            'types-websocket-client',
            'types-python-dotenv',
            'types-rich',
            'types-click',
            'types-typer',
            'types-uvicorn',
            'types-fastapi',
            'types-jinja2',
            'types-aiofiles',
            'types-python-multipart',
        ]